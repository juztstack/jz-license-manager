<div class="w-full max-w-sm">
  <div class="text-center mb-8">
    <p class="text-gray-400 text-sm mt-1">Sign in to your account</p>
  </div>

  <div class="bg-gray-800 border border-gray-700 rounded-xl p-6 space-y-5">

    <div data-if="errorVisible" class="rounded-md bg-red-900/50 border border-red-700 px-3 py-2">
      <p class="text-sm text-red-300" data-text="errorMsg"></p>
    </div>

    <div>
      <label class="block text-xs font-medium text-gray-400 mb-1.5">Email</label>
      <input
        id="input-email"
        type="email"
        data-bind="email"
        placeholder="admin@example.com"
        autocomplete="email"
        class="w-full bg-gray-700 border border-gray-600 rounded-md px-3 py-2 text-sm text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent"
      />
    </div>

    <div>
      <label class="block text-xs font-medium text-gray-400 mb-1.5">Password</label>
      <input
        id="input-password"
        type="password"
        data-bind="password"
        placeholder="••••••••"
        autocomplete="current-password"
        class="w-full bg-gray-700 border border-gray-600 rounded-md px-3 py-2 text-sm text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent"
      />
    </div>

    <button
      id="btn-login"
      class="w-full bg-indigo-600 hover:bg-indigo-500 text-white text-sm font-medium py-2 rounded-md transition-colors"
    >
      Sign in
    </button>
  </div>
</div>
