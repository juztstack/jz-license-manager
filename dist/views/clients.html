<div class="space-y-6">
  <div class="flex items-center justify-between">
    <div>
      <h2 class="text-lg font-semibold text-white">Clients</h2>
      <p class="text-sm text-gray-400 mt-0.5" data-text="countLabel"></p>
    </div>
    <button
      id="btn-new-client"
      class="inline-flex items-center gap-2 bg-indigo-600 hover:bg-indigo-500 text-white text-sm font-medium px-4 py-2 rounded-md transition-colors"
    >
      + New Client
    </button>
  </div>

  <!-- Create form -->
  <div data-if="formVisible" class="bg-gray-800 border border-gray-700 rounded-lg p-5">
    <h3 class="text-sm font-semibold text-white mb-4" data-text="formTitle"></h3>
    <div class="grid grid-cols-2 gap-4">
      <div>
        <label class="block text-xs text-gray-400 mb-1.5">Name</label>
        <input id="f-name" type="text" placeholder="Acme Corp"
          class="w-full bg-gray-700 border border-gray-600 rounded-md px-3 py-2 text-sm text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-indigo-500" />
      </div>
      <div>
        <label class="block text-xs text-gray-400 mb-1.5">Contact Email</label>
        <input id="f-contact" type="email" placeholder="contact@acme.com"
          class="w-full bg-gray-700 border border-gray-600 rounded-md px-3 py-2 text-sm text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-indigo-500" />
      </div>
      <div>
        <label class="block text-xs text-gray-400 mb-1.5">Company</label>
        <input id="f-company" type="text" placeholder="Acme Inc."
          class="w-full bg-gray-700 border border-gray-600 rounded-md px-3 py-2 text-sm text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-indigo-500" />
      </div>
    </div>
    <div data-if="formError" class="mt-3 text-sm text-red-400" data-text="formErrorMsg"></div>
    <div class="flex gap-3 mt-4">
      <button id="btn-submit" class="bg-indigo-600 hover:bg-indigo-500 text-white text-sm font-medium px-4 py-2 rounded-md transition-colors" data-text="submitLabel"></button>
      <button id="btn-cancel" class="bg-gray-700 hover:bg-gray-600 text-gray-300 text-sm font-medium px-4 py-2 rounded-md transition-colors">Cancel</button>
    </div>
  </div>

  <!-- Table -->
  <div class="bg-gray-800 rounded-lg border border-gray-700 overflow-hidden">
    <table class="w-full text-left text-sm">
      <thead>
        <tr class="border-b border-gray-700">
          <th class="px-4 py-3 text-xs font-medium text-gray-400 uppercase tracking-wider">Name</th>
          <th class="px-4 py-3 text-xs font-medium text-gray-400 uppercase tracking-wider">Contact</th>
          <th class="px-4 py-3 text-xs font-medium text-gray-400 uppercase tracking-wider">Company</th>
          <th class="px-4 py-3 text-xs font-medium text-gray-400 uppercase tracking-wider">Status</th>
          <th class="px-4 py-3 text-xs font-medium text-gray-400 uppercase tracking-wider">Actions</th>
        </tr>
      </thead>
      <tbody data-html="rowsHtml"></tbody>
    </table>
  </div>
</div>
